name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # pnpm first: `cache: pnpm` makes setup-node resolve the store by running
      # pnpm, which is not on a runner's PATH until this step puts it there.
      # No `version` here: the action refuses to run when the version is given
      # both to it and in package.json's `packageManager`, which is where this
      # repository already keeps it.
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # `pnpm audit` is pnpm's own vulnerability command; the boundary audit is
      # a script and needs `run` to reach it.
      - run: pnpm run audit
      - run: pnpm audit:test
      - run: pnpm test
